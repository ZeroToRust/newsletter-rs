[package]
name = "newsletter-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"  
eyre = "0.6"  # For convinient error handling  
tokio = { version = "1", features = ["full"] }  
serde = { version = "1.0.228", features = ["derive"]}

[lib]
path = "src/lib.rs"

# [[bin]]
# path = "tests/health_check_test.rs"
# name = "health_check_test"


# [[bin]]
# path = "src/main.rs"
# name = "newsletter-rs"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-test = "0.4"

[dependencies.sqlx]
version = ">=0.8.6"
default-features = false
features = ["runtime-tokio-rustls", "macros",
"postgres", "uuid", "chrono", "migrate"
]

