name: CI Pipeline

on:
  push:
  pull_request:
    branches: [main]
  
jobs:
  ci-checks:
    name: Run CI checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      
      - name: Optimize Build Performance
        uses: rui314/setup-mold@v1
      
      - name: Format Check
        run: cargo fmt --all --check

      - name: Cargo Build
        run: cargo build --all-features --all-targets

      - name: Cargo test
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --all-features --all-targets

      - name: Run Documentation Tests
        run: cargo test --doc --all-features

      - name: Check for unused dependencies
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
          # args: check --with-metadata

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    needs: ci-checks
    container:
      image: xd009642/tarpaulin
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate coverage with threshold check
        run: |
          chmod +x /scripts/code_coverage.sh
          ./scripts/code_coverage.sh
      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
